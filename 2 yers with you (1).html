  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: transparent;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow-x: clip;
    font-family: 'Oswald', 'Arial Narrow', sans-serif;
  }

  /* One fixed-ratio stage; every size is in cqw so the collage scales as a unit */
  .stage {
    position: relative;
    width: var(--w);
    flex: none;
    aspect-ratio: 736 / 1308;
    container-type: inline-size;
  }
  .abs { position: absolute; }
  .layer { position: absolute; display: block; user-select: none; -webkit-user-drag: none; }


  /* ---------- polaroid ---------- */
  .polaroid {
    left: 9.5%; top: 27.2%; width: 81.3%;
    aspect-ratio: 1016 / 1215;
  }
  .polaroid .frame {
    position: absolute; inset: 0; width: 100%; height: 100%;
    z-index: 2; pointer-events: none;
    filter: drop-shadow(0 .6cqw 1.4cqw rgba(60,10,15,.3));
  }
  /* photo window sits slightly larger than the hole and tucks under the frame */
  .photo {
    position: absolute; z-index: 1;
    left: 7.2%; top: 6.2%; width: 85.5%; height: 73.3%;
    background: #000; overflow: hidden; cursor: pointer; display: block;
  }
  .photo:focus-visible { outline: .8cqw solid #f1e1b9; outline-offset: -1cqw; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .photo.has-img img { display: block; }
  .photo .hint {
    position: absolute; inset: 0; display: grid; place-items: center;
    color: rgba(255,255,255,.22);
    font: 700 3.4cqw 'Oswald', sans-serif; letter-spacing: .08em;
  }
  .photo.has-img .hint { display: none; }

  /* ---------- cats ---------- */
  .cats { left: 49.2%; top: 4.9%; width: 47%; z-index: 4; filter: drop-shadow(0 .4cqw .6cqw rgba(60,30,30,.22)); }

  /* ---------- stickers ---------- */
  .love {
    left: 3.4%; top: 17.2%; width: 30.5%; z-index: 4;
    transform: rotate(-13deg);
    filter: drop-shadow(0 .3cqw .5cqw rgba(60,30,30,.25));
  }
  .fav {
    left: 80.6%; top: 44.3%; width: 23.5%; z-index: 4;
    transform: rotate(78deg);
    filter: drop-shadow(0 .3cqw .5cqw rgba(60,30,30,.25));
  }

  /* ---------- caption ---------- */
  .years { left: 10.2%; top: 72.4%; display: flex; align-items: flex-end; color: #fff; z-index: 3; }
  .years .num {
    font: 400 14.5cqw/0.9 'Anton', 'Impact', 'Arial Narrow', sans-serif;
    -webkit-text-stroke: .7cqw #fff;
    filter: url(#rough);
  }
  .years .txt {
    font: 400 4.7cqw/1 'Anton', 'Impact', 'Arial Narrow', sans-serif;
    letter-spacing: -.02em;
    word-spacing: .35em;
    -webkit-text-stroke: .15cqw #fff;
    margin: 0 0 1.2cqw -.2cqw;
    filter: url(#rough-light);
  }

  /* ---------- note card + bow ---------- */
  .tab {
    left: 48.9%; top: 77.2%; width: 27.2%; height: 2.4%; z-index: 3;
    background: #f7f3ee;
    clip-path: polygon(0 100%, 6% 30%, 30% 0, 70% 0, 94% 30%, 100% 100%);
  }
  .note {
    left: 31.8%; top: 79.3%; width: 54.3%; height: 18.6%; z-index: 3;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.35), transparent 60%),
      var(--card);
    box-shadow: 0 .6cqw 1.6cqw rgba(50,25,10,.28);
    display: grid; place-items: center;
    padding: 7% 3% 3%;
    text-align: center;
  }
  .note p {
    margin: 0;
    font: 400 4.6cqw/1.22 'Caveat Brush', 'Amatic SC', 'Arial Narrow', sans-serif;
    text-transform: uppercase;
    color: #14110f;
    -webkit-text-stroke: .08cqw #14110f;
    word-spacing: .22em;
    text-wrap: balance;
  }
  .note .hole {
    position: absolute; left: 49.5%; top: 2.2%;
    width: 3.4cqw; height: 3.4cqw; border-radius: 50%;
    background: #fff; box-shadow: inset 0 0 0 .2cqw rgba(0,0,0,.08);
    transform: translateX(-50%);
  }
  .bow { left: 44.6%; top: 72.2%; width: 37.5%; z-index: 5; filter: drop-shadow(0 .3cqw .4cqw rgba(60,40,20,.25)); }
</style>
</head>

<script>
  (function () {
    var card = document.querySelector('.note');
    var p = card.querySelector('p');
    function fit() {
      p.style.fontSize = '';
      var size = parseFloat(getComputedStyle(p).fontSize);
      var max = card.clientHeight * 0.76, guard = 60;
      while (p.scrollHeight > max && size > 8 && guard--) { size -= 0.5; p.style.fontSize = size + 'px'; }
    }
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(fit);
    window.addEventListener('resize', fit);
  })();
  (function () {
    var photo = document.getElementById('photo');
    var input = document.getElementById('file');
    var img = document.getElementById('photoImg');
    input.addEventListener('change', function () {
      var f = input.files && input.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function (e) {
        img.src = e.target.result;
        photo.classList.add('has-img');
      };
      reader.readAsDataURL(f);
    });
    photo.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); }
    });
  })();
</script>
